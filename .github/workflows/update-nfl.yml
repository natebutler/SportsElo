name: Weekly NFL Elo Update

on:
  schedule:
    - cron: '0 15 * * 2'   # 10:00 AM CDT Tuesdays (after Monday Night Football)
  workflow_dispatch:

jobs:
  update-nfl:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::nflfastR
            any::nflreadr
            any::dplyr
            any::jsonlite
            any::tibble


      - name: Run NFL Update Script
        run: Rscript scripts/update_nfl.R

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Weekly NFL Elo Update [skip ci]"
          file_pattern: "data/nfl.json data/nfl_elo.rds"
