name: Weekly NFL Elo Update

on:
  schedule:
    - cron: '0 15 * * 2'   # 10:00 AM CDT Tuesdays (after Monday Night Football)
  workflow_dispatch:

jobs:
  update-nfl:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Cache R Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-nfl-${{ hashFiles('scripts/update_nfl.R') }}
          restore-keys: |
            ${{ runner.os }}-r-nfl-

      - name: Install R Packages
        run: |
          Rscript -e '
            required <- c("nflfastR", "nflreadr", "dplyr", "jsonlite", "tibble")
            installed <- rownames(installed.packages())
            to_install <- setdiff(required, installed)
            if (length(to_install) > 0) install.packages(to_install, repos = "https://cloud.r-project.org")
          '

      - name: Run NFL Update Script
        run: Rscript scripts/update_nfl.R

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Weekly NFL Elo Update [skip ci]"
          file_pattern: "data/nfl.json data/nfl_elo.rds"
