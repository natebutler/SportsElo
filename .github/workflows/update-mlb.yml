name: Daily MLB Elo Update

on:
  schedule:
    - cron: '0 10 * * *'   # 5:00 AM CDT daily
  workflow_dispatch:

jobs:
  update-mlb:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Cache R Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-mlb-${{ hashFiles('scripts/update_mlb.R') }}
          restore-keys: |
            ${{ runner.os }}-r-mlb-

      - name: Install R Packages
        run: |
          Rscript -e '
            required <- c("httr", "jsonlite", "tidyverse", "mlbplotR", "ggplot2")
            installed <- rownames(installed.packages())
            to_install <- setdiff(required, installed)
            if (length(to_install) > 0) install.packages(to_install, repos = "https://cloud.r-project.org")
          '

      - name: Run MLB Update Script
        run: Rscript scripts/update_mlb.R

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Daily MLB Elo Update [skip ci]"
          file_pattern: "data/mlb.json data/mlb_trend.png data/mlb_elo.rds"
