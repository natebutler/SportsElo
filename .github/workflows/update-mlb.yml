name: Daily MLB Elo Update

on:
  schedule:
    - cron: '17 9 * * *'   # 4:17 AM CDT / 3:17 AM CST daily (off-peak)
  workflow_dispatch:

jobs:
  update-mlb:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::tidyverse
            any::mlbplotR
            any::ggplot2


      - name: Run MLB Update Script
        run: Rscript scripts/update_mlb.R

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Daily MLB Elo Update [skip ci]"
          file_pattern: "data/mlb.json data/mlb_history.json data/mlb_trend.png data/mlb_elo.rds"
