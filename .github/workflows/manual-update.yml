name: Manual Elo Update

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Sport to update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mlb
          - nfl

jobs:
  update-sports:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::tidyverse
            any::mlbplotR
            any::ggplot2
            any::nflfastR
            any::nflreadr


      - name: Run MLB Update
        if: inputs.target == 'all' || inputs.target == 'mlb'
        run: Rscript scripts/update_mlb.R

      - name: Run NFL Update
        if: inputs.target == 'all' || inputs.target == 'nfl'
        run: Rscript scripts/update_nfl.R

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Manual Sports Elo Update (${{ inputs.target }}) [skip ci]"
          file_pattern: "data/*"
