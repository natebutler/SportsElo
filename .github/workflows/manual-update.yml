name: Manual Elo Update

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Sport to update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mlb
          - nfl

jobs:
  update-sports:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup System Dependencies
        if: inputs.target == 'all' || inputs.target == 'mlb'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Cache R Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-all-${{ hashFiles('scripts/*.R') }}
          restore-keys: |
            ${{ runner.os }}-r-all-

      - name: Install R Packages
        run: |
          Rscript -e '
            required <- c("httr", "jsonlite", "tidyverse", "mlbplotR", "ggplot2", "nflfastR", "nflreadr")
            installed <- rownames(installed.packages())
            to_install <- setdiff(required, installed)
            if (length(to_install) > 0) install.packages(to_install, repos = "https://cloud.r-project.org")
          '

      - name: Run MLB Update
        if: inputs.target == 'all' || inputs.target == 'mlb'
        run: Rscript scripts/update_mlb.R

      - name: Run NFL Update
        if: inputs.target == 'all' || inputs.target == 'nfl'
        run: Rscript scripts/update_nfl.R

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Manual Sports Elo Update (${{ inputs.target }}) [skip ci]"
          file_pattern: "data/*"
