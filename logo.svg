<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Shield Glow / Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Energy Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Trend Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" filter="url(#shadow)" />

  <!-- Subtle Sport Seam Line & Rating Pulse Arc (Baseball / Football seam subtle curve) -->
  <path d="M 68 180 Q 256 120 444 180" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 8" stroke-opacity="0.25" />
  <path d="M 68 332 Q 256 392 444 332" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 8" stroke-opacity="0.2" />

  <!-- Rating Trend / Graph Line ascending -->
  <path d="M 100 370 L 190 320 L 260 280 L 330 220 L 415 150" fill="none" stroke="url(#arrowGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Trend Arrow Head -->
  <polygon points="415,130 435,168 395,162" fill="#34d399" />

  <!-- Central Dynamic Power Bolt (Elo Energy) -->
  <path d="M 284 96 L 168 266 L 256 266 L 228 416 L 356 236 L 272 236 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#boltGlow)" />

  <!-- "ELO" Wordmark Badge -->
  <g transform="translate(256, 442)">
    <!-- Badge Background -->
    <rect x="-92" y="-32" width="184" height="44" rx="22" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="3" />
    <text x="0" y="-3" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="26" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#f8fafc" 
          text-anchor="middle">ELO</text>
  </g>
</svg>
